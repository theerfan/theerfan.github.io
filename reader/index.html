<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader · Erfan Abedi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <link rel="stylesheet" href="css/doc.css?v=14">
  <link rel="stylesheet" href="css/styles.css?v=14">
  <script src="js/prefs.js?v=12"></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Show files" title="Files">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg>
    </button>
    <button type="button" class="icon-btn topbar-files" id="filesBtn" data-action="toggle-sidebar" aria-controls="sidebar" aria-expanded="true" aria-label="Hide files" title="Hide files">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg>
    </button>
    <a class="brand" href="#/">Reader</a>
    <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
    <div class="topbar-actions">
      <div class="seg" id="alignGroup" role="group" aria-label="Page alignment">
        <button type="button" data-align="left" title="Align left" aria-label="Align left">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 6.5h8M2 9.5h12M2 12.5h8"/></svg>
        </button>
        <button type="button" data-align="center" title="Align center" aria-label="Align center">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M4 6.5h8M2 9.5h12M4 12.5h8"/></svg>
        </button>
        <button type="button" data-align="right" title="Align right" aria-label="Align right">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M6 6.5h8M2 9.5h12M6 12.5h8"/></svg>
        </button>
      </div>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
        <svg class="theme-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
        <svg class="theme-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/></svg>
      </button>
      <details class="more" id="moreMenu">
        <summary class="icon-btn" aria-label="More" title="More">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="13" cy="8" r="1.2"/></svg>
        </summary>
        <div class="more-panel">
          <form class="jump-bar" id="jumpFormBar" action="#" method="get" role="search">
            <input id="jumpInputBar" type="search" placeholder="owner/repo, folder, or GitHub URL" enterkeyhint="go" autocomplete="off" spellcheck="false" aria-label="Open a GitHub repository or folder">
          </form>
          <a id="githubLink" hidden href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="#/">Catalog</a>
          <a href="/">Home</a>
        </div>
      </details>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-head-text">
          <p class="sidebar-title" id="sidebarTitle">Notes</p>
          <p class="sidebar-meta" id="sidebarMeta"></p>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-expanded="true" aria-controls="sidebar" title="Collapse sidebar">Hide</button>
      </div>
      <div class="folder-tools" id="folderTools" hidden>
        <button type="button" id="collapseAll">Collapse all</button>
        <button type="button" id="expandAll">Expand all</button>
      </div>
      <ul class="file-list" id="fileList"></ul>
      <p class="truncated" id="truncatedNote" hidden>GitHub truncated this tree; some files may be missing.</p>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <p class="status" id="status" hidden></p>

      <section class="article catalog" id="catalogView">
        <h1>Reader</h1>
        <p class="lede">Markdown and HTML from public GitHub repos, rendered with math. Open a repo below, or paste any public GitHub address — including a folder.</p>
        <form class="jump jump-hero" id="jumpForm" action="#" method="get" role="search">
          <input id="jumpInput" type="search" placeholder="owner/repo, folder path, or https://github.com/owner/repo/tree/…" enterkeyhint="go" autocomplete="off" spellcheck="false" aria-label="Open a GitHub repository or folder">
          <p class="jump-error" id="jumpError" hidden></p>
        </form>
        <h2 class="saved-heading">Saved libraries</h2>
        <div class="repo-grid" id="repoList"></div>
      </section>

      <section class="article" id="repoView" hidden>
        <div id="article"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <script src="js/github.js?v=12"></script>
  <script src="js/doc.js?v=15"></script>
  <script src="js/ink.js?v=12"></script>
  <script src="js/frame-host.js?v=12"></script>
  <script src="js/markdown.js?v=12"></script>
  <script src="js/html.js?v=12"></script>
  <script src="js/app.js?v=16"></script>
</body>
</html>
