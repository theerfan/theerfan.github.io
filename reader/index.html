<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader · Erfan Abedi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <link rel="stylesheet" href="css/styles.css?v=6">
  <script src="js/prefs.js?v=6"></script>
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="sidebar">Notes</button>
    <button type="button" class="icon-btn topbar-files" id="filesBtn" data-action="toggle-sidebar" aria-controls="sidebar" aria-expanded="true">Hide files</button>
    <a class="brand" href="#/">Reader <span>notes</span></a>
    <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
    <form class="jump-bar" id="jumpFormBar" action="#" method="get" role="search">
      <input id="jumpInputBar" type="search" placeholder="owner/repo, folder, or GitHub URL" enterkeyhint="go" autocomplete="off" spellcheck="false" aria-label="Open a GitHub repository or folder">
    </form>
    <div class="topbar-actions">
      <div class="seg" id="alignGroup" role="group" aria-label="Page alignment">
        <button type="button" data-align="left" title="Align left">Left</button>
        <button type="button" data-align="center" title="Align center">Center</button>
        <button type="button" data-align="right" title="Align right">Right</button>
      </div>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">Dark</button>
      <a id="githubLink" hidden href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="home-link" href="/">Home</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-head-text">
          <p class="sidebar-title" id="sidebarTitle">Notes</p>
          <p class="sidebar-meta" id="sidebarMeta"></p>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-expanded="true" aria-controls="sidebar" title="Collapse sidebar">Hide</button>
      </div>
      <div class="folder-tools" id="folderTools" hidden>
        <button type="button" id="collapseAll">Collapse all</button>
        <button type="button" id="expandAll">Expand all</button>
      </div>
      <ul class="file-list" id="fileList"></ul>
      <p class="truncated" id="truncatedNote" hidden>GitHub truncated this tree; some files may be missing.</p>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <p class="status" id="status" hidden></p>

      <section class="article catalog" id="catalogView">
        <h1>Reader</h1>
        <p class="lede">Markdown from public GitHub repos, rendered with math. Open a repo below, or paste any public GitHub address — including a folder.</p>
        <form class="jump jump-hero" id="jumpForm" action="#" method="get" role="search">
          <input id="jumpInput" type="search" placeholder="owner/repo, folder path, or https://github.com/owner/repo/tree/…" enterkeyhint="go" autocomplete="off" spellcheck="false" aria-label="Open a GitHub repository or folder">
          <p class="jump-error" id="jumpError" hidden></p>
        </form>
        <h2 class="saved-heading">Saved libraries</h2>
        <div class="repo-grid" id="repoList"></div>
      </section>

      <section class="article" id="repoView" hidden>
        <div id="article"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <script src="js/github.js?v=6"></script>
  <script src="js/markdown.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
